[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-guard"
version = "0.1.0"
description = "A lightweight runtime firewall and reliability layer for MCP servers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "MCP-Guard" }]
license = { text = "Apache-2.0" }

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[project.optional-dependencies]
observability = [
  "openinference-semantic-conventions>=0.1.30,<0.2",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
