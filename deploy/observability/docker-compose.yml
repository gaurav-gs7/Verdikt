services:
  gatetrace-mcp:
    build:
      context: ../..
    image: gatetrace-mcp:observability
    environment:
      MCP_GUARD_MODE: real-mcp
      MCP_GUARD_HTTP_BEARER_TOKEN: local-dev-token
      MCP_GUARD_APPROVAL_SECRET: local-dev-approval-secret
      MCP_GUARD_REDIS_URL: redis://redis:6379/0
      MCP_GUARD_TELEMETRY: otlp
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://tempo:4318/v1/traces
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - tempo

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gatetrace-mcp

  tempo:
    image: grafana/tempo:2.6.1
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
    ports:
      - "3200:3200"
      - "4318:4318"

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14318:4318"

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
