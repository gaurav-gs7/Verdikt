apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mcp-guard.fullname" . }}
  labels:
    {{- include "mcp-guard.labels" . | nindent 4 }}
type: Opaque
stringData:
  MCP_GUARD_APPROVAL_SECRET: {{ .Values.approvalSecret | quote }}
  MCP_GUARD_HTTP_BEARER_TOKEN: {{ .Values.auth.bearerToken | quote }}
  MCP_GUARD_JWT_HS256_SECRET: {{ .Values.auth.jwtHs256Secret | quote }}
