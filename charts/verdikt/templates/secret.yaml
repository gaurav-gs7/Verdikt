apiVersion: v1
kind: Secret
metadata:
  name: {{ include "verdikt.fullname" . }}
  labels:
    {{- include "verdikt.labels" . | nindent 4 }}
type: Opaque
stringData:
  VERDIKT_APPROVAL_SECRET: {{ .Values.approvalSecret | quote }}
  VERDIKT_HTTP_BEARER_TOKEN: {{ .Values.auth.bearerToken | quote }}
  VERDIKT_JWT_HS256_SECRET: {{ .Values.auth.jwtHs256Secret | quote }}
  VERDIKT_AUDIT_HMAC_SECRET: {{ .Values.audit.hmacSecret | quote }}
  VERDIKT_ARGUS_API_TOKEN: {{ .Values.argus.apiToken | quote }}
  VERDIKT_ARGUS_HMAC_SECRET: {{ .Values.argus.hmacSecret | quote }}
