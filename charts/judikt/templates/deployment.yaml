apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "judikt.fullname" . }}
  labels:
    {{- include "judikt.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "judikt.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "judikt.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "judikt.serviceAccountName" . }}
      containers:
        - name: judikt
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: JUDIKT_MODE
              value: real-mcp
            - name: JUDIKT_APPROVAL_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_APPROVAL_SECRET
            - name: JUDIKT_HTTP_BEARER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_HTTP_BEARER_TOKEN
            - name: JUDIKT_JWT_HS256_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_JWT_HS256_SECRET
            - name: JUDIKT_AUDIT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_AUDIT_HMAC_SECRET
            - name: JUDIKT_AUDIT_SIGNATURE_REQUIRED
              value: {{ .Values.audit.signatureRequired | quote }}
            - name: JUDIKT_AUDIT_VERIFY_ON_STARTUP
              value: {{ .Values.audit.verifyOnStartup | quote }}
            - name: JUDIKT_AUDIT_SINK
              value: {{ .Values.audit.sink | quote }}
            - name: JUDIKT_AUDIT_SINK_STRICT
              value: {{ .Values.audit.sinkStrict | quote }}
            - name: JUDIKT_JWT_ISSUER
              value: {{ .Values.auth.jwtIssuer | quote }}
            - name: JUDIKT_JWT_AUDIENCE
              value: {{ .Values.auth.jwtAudience | quote }}
            - name: JUDIKT_JWT_REQUIRED_GROUP
              value: {{ .Values.auth.jwtRequiredGroup | quote }}
            - name: JUDIKT_JWT_JWKS_URL
              value: {{ .Values.auth.jwtJwksUrl | quote }}
            - name: JUDIKT_RESOURCE_URI
              value: {{ .Values.auth.resourceUri | quote }}
            - name: JUDIKT_AUTHORIZATION_SERVER
              value: {{ .Values.auth.authorizationServer | quote }}
            - name: JUDIKT_REQUIRED_SCOPES
              value: {{ .Values.auth.requiredScopes | quote }}
            - name: JUDIKT_ADMIN_SCOPE
              value: {{ .Values.auth.adminScope | quote }}
            - name: JUDIKT_ALLOWED_ORIGINS
              value: {{ .Values.auth.allowedOrigins | quote }}
            - name: JUDIKT_REDIS_URL
              value: {{ .Values.redis.url | quote }}
            - name: JUDIKT_REDIS_REQUIRED
              value: {{ .Values.redis.required | quote }}
            - name: JUDIKT_ARGUS_URL
              value: {{ .Values.argus.url | quote }}
            - name: JUDIKT_ARGUS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_ARGUS_API_TOKEN
            - name: JUDIKT_ARGUS_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_ARGUS_HMAC_SECRET
            - name: JUDIKT_ARGUS_ALLOW_INSECURE_HTTP
              value: {{ .Values.argus.allowInsecureHttp | quote }}
            - name: JUDIKT_SIEM_URL
              value: {{ .Values.siem.url | quote }}
            - name: JUDIKT_SIEM_PROTOCOL
              value: {{ .Values.siem.protocol | quote }}
            - name: JUDIKT_SIEM_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_SIEM_TOKEN
            - name: JUDIKT_SIEM_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "judikt.fullname" . }}
                  key: JUDIKT_SIEM_HMAC_SECRET
            - name: JUDIKT_SIEM_TIMEOUT_SECONDS
              value: {{ .Values.siem.timeoutSeconds | quote }}
            - name: JUDIKT_SIEM_ALLOW_INSECURE_HTTP
              value: {{ .Values.siem.allowInsecureHttp | quote }}
            - name: JUDIKT_TELEMETRY
              value: {{ .Values.telemetry.mode | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.telemetry.otlpEndpoint | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
          {{- else }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "judikt.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
