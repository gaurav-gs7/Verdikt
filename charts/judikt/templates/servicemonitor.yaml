{{- if .Values.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "judikt.fullname" . }}
  labels:
    {{- include "judikt.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "judikt.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      {{- if .Values.auth.bearerToken }}
      bearerTokenSecret:
        name: {{ include "judikt.fullname" . }}
        key: JUDIKT_HTTP_BEARER_TOKEN
      {{- end }}
{{- end }}
