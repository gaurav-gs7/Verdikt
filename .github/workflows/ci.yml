name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project with MCP support
        run: python -m pip install -e '.[mcp,auth,redis]'
      - name: Run tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: Run adversarial evals
        run: PYTHONPATH=src python -m verdikt.cli eval
      - name: Run attack-benchmark adapter smoke profile
        run: >-
          PYTHONPATH=src python -m verdikt.cli attackbench
          tests/fixtures/attackbench_smoke.jsonl
          --dataset-id verdikt-tier2-smoke
          --expected-samples 8
          --min-precision 1 --min-recall 1 --min-f1 1
          --output build/attackbench-smoke.json
      - name: Run failure-mode tests
        run: PYTHONPATH=src python -m verdikt.failure_tests
      - uses: actions/upload-artifact@v4
        with:
          name: attackbench-smoke-evidence
          path: build/attackbench-smoke.json

  redis-integration:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Redis profile
        run: python -m pip install -e '.[redis]'
      - name: Prove limits are shared by independent gateway instances
        env:
          VERDIKT_TEST_REDIS_URL: redis://127.0.0.1:6379/15
        run: PYTHONPATH=src python -m unittest discover -s tests -p 'test_redis_integration.py' -v

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.15.4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"
      - name: Package serverless Lambda artifact
        run: ./scripts/aws/package_serverless.sh
      - name: Terraform fmt
        run: terraform fmt -check -recursive infra/aws/terraform infra/aws/serverless
      - name: Render production Helm chart
        run: helm template verdikt charts/verdikt
      - name: Validate EC2 real MCP Terraform
        run: |
          terraform -chdir=infra/aws/terraform init -backend=false
          terraform -chdir=infra/aws/terraform validate
      - name: Validate serverless Terraform
        run: |
          terraform -chdir=infra/aws/serverless init -backend=false
          terraform -chdir=infra/aws/serverless validate

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build production MCP container
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: verdikt:ci
      - name: Verify production runtime dependencies
        run: >-
          docker run --rm --entrypoint python verdikt:ci -c
          "import boto3, jwt, mcp, openinference.semconv, opentelemetry, redis"

  community-interop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Verdikt
        run: python -m pip install -e .
      - name: Verify pinned official MCP servers
        run: python -m verdikt.cli interop --output build/community-interop.json
      - uses: actions/upload-artifact@v4
        with:
          name: community-mcp-interoperability
          path: build/community-interop.json
