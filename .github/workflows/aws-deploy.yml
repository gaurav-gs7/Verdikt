name: AWS Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        type: choice
        options:
          - serverless
          - ec2-real-mcp
      aws_region:
        description: AWS region
        required: true
        default: us-east-1
      allowed_cidr:
        description: EC2 ingress CIDR for ec2-real-mcp, for example 203.0.113.10/32
        required: false
        default: 127.0.0.1/32

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.5.7"

      - uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy serverless control plane
        if: inputs.target == 'serverless'
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          VERDIKT_API_TOKEN: ${{ secrets.VERDIKT_API_TOKEN }}
          VERDIKT_APPROVAL_SECRET: ${{ secrets.VERDIKT_APPROVAL_SECRET }}
          VERDIKT_AUDIT_HMAC_SECRET: ${{ secrets.VERDIKT_AUDIT_HMAC_SECRET }}
        run: ./scripts/aws/deploy_serverless.sh

      - name: Deploy EC2 real MCP server
        if: inputs.target == 'ec2-real-mcp'
        env:
          AWS_REGION: ${{ inputs.aws_region }}
          VERDIKT_ALLOWED_CIDR: ${{ inputs.allowed_cidr }}
          VERDIKT_MODE: real-mcp
          VERDIKT_HTTP_BEARER_TOKEN: ${{ secrets.VERDIKT_HTTP_BEARER_TOKEN }}
          VERDIKT_APPROVAL_SECRET: ${{ secrets.VERDIKT_APPROVAL_SECRET }}
          VERDIKT_AUDIT_HMAC_SECRET: ${{ secrets.VERDIKT_AUDIT_HMAC_SECRET }}
        run: ./scripts/aws/deploy_terraform.sh
